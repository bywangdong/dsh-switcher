<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>DSH Switcher · 无文字状态</title>
  <link rel="stylesheet" href="baseline.css">
  <link rel="stylesheet" href="../../src/study/surfaces.css">
  <link rel="stylesheet" href="../../src/study/recognition.css">
  <link rel="stylesheet" href="../../src/study/project-tabs.css">
  <link rel="stylesheet" href="../design-lab/lab.css">
  <link rel="stylesheet" href="signals.css">
</head>
<body data-theme="dark">
  <header class="masthead"><a class="wordmark" href="./">DSH <span>Switcher</span></a><a class="history-link" href="../project-tabs/?layout=soft&theme=dark">上一轮题签方案</a></header>
  <main>
    <section class="intro">
      <p class="eyebrow">STATUS · WITHOUT LABELS</p>
      <h1>状态，让图形来说。</h1>
      <p class="intro-copy">完整五拍图标，固定的位置。把阅读空间还给会话。</p>
    </section>
    <div class="toolbar">
      <div class="segmented" aria-label="状态位置">
        <button data-placement="corner" aria-pressed="true">A · 右下角</button>
        <button data-placement="inline" aria-pressed="false">B · 标题前</button>
        <button data-placement="original" aria-pressed="false">当前版</button>
      </div>
      <div class="toolbar-end">
        <button id="compare" class="text-button" aria-pressed="false">三版对照</button>
        <div class="segmented" aria-label="明暗外观"><button data-theme="light" aria-pressed="false">亮色</button><button data-theme="dark" aria-pressed="true">暗色</button></div>
      </div>
    </div>
    <div id="previews"></div>
    <section class="scenario-bar" aria-label="对照设置">
      <label>文案<select id="scene"><option value="daily">原示例</option><option value="long">长文案</option></select></label>
      <label class="motion-control"><input type="checkbox" id="still">静态形态</label>
      <span class="scenario-note">B「轻透」· 942 × 190 · 图标 20px · 演示状态</span>
    </section>
    <p class="recommendation">推荐 A：标题保持完整宽度，状态沿右下角对齐。B 更容易在读标题时注意到状态，但长标题会更早折行。</p>
    <details class="key"><summary>查看图形含义</summary><div id="legend"></div></details>
    <footer class="study-footer"><p>方向键切换选中项，Enter 演示打开。图标保留读屏语义，卡片内不放状态文字。</p><p>设计对照 · 状态为模拟数据 · 浏览器原型，尚未应用到 DSH。</p></footer>
  </main>
  <div id="notice" role="status" aria-live="polite"></div>
  <script type="module" src="signals.js"></script>
</body>
</html>
