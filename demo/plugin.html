<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DSH Switcher · 插件界面与配置验证</title>
<link rel="stylesheet" href="../src/plugin/switcher.css">
<style>
body { margin:0; font:14px/1.6 -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; background:#f5f6f7; color:#1b1d21; }
body[data-theme=dark] { background:#151517; color:#e7e8e9; }
aside { position:fixed; inset:0 auto 0 0; width:220px; padding:24px; box-sizing:border-box; background:#88888812; border-right:1px solid #88888818; }
main { margin:36px 32px 100px 252px; max-width:960px; }
h1 { font-size:22px; margin:0 0 4px; }
p { color:#7a7f87; margin:4px 0 12px; font-size:13px; }
button, textarea { font:inherit; }
nav button { margin:3px; padding:6px 11px; border-radius:8px; border:1px solid #88888830; background:#88888814; color:inherit; cursor:pointer; font-size:12.5px; }
textarea { width:100%; height:64px; margin-top:12px; box-sizing:border-box; border-radius:8px; padding:8px 10px; border:1px solid #88888830; background:transparent; color:inherit; }
#settings-mount { margin:14px 0; }
nav { position:fixed; bottom:18px; left:50%; transform:translateX(-50%); white-space:nowrap; z-index:10001; padding:5px 8px; border-radius:12px; background:rgb(245 246 247 / .86); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); border:1px solid #88888826; }
body[data-theme=dark] nav { background:rgb(24 25 28 / .86); }
body[data-backdrop=reference] { min-height:100vh; background-image:url('./materials/reference/context-light.png'); background-size:cover; background-position:center; }
body[data-backdrop=reference][data-theme=dark] { background-image:url('./materials/reference/context-dark.png'); }
body[data-backdrop=reference] :is(aside,main), body[data-clean=true] nav { display:none; }
@media(max-width:760px) {
  aside { display:none; }
  main { margin:20px 14px 96px; }
  nav { width:calc(100% - 24px); white-space:normal; text-align:center; bottom:10px; }
  nav button { padding:4px 8px; }
}
</style></head><body><aside>插件 / Plugins<br><br><strong>dsh-switcher</strong><br>0.1.11 · 已启用<br><br>工作区<br>dshMagicShortcuts<br>proxyAutoSwitch</aside>
<main><h1>dsh-switcher · 插件详情页配置预览</h1><p>以下直接挂载正式 <code>src/plugin/settings.js</code> 与 <code>src/plugin/view.js</code>，数据为验证样例。</p><p id="current">当前：打磨键盘导航体验</p><div id="settings-mount"></div><textarea aria-label="测试草稿" placeholder="可输入草稿，再测试 Esc 取消与焦点恢复"></textarea></main>
<nav><button id="show">体验浮层</button><button id="close-overlay">收起浮层看配置</button><button id="light">亮色</button><button id="dark">暗色</button><button id="state">改变运行状态</button><button id="project">重命名项目</button><button id="dispose">卸载界面</button></nav><div id="mount"></div>
<script type="module" src="plugin-demo.js"></script></body></html>
